name: Linter

on:
  pull_request:

jobs:
  lint:
    name: Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install black==26.5.1 isort==9.0.1

      - name: Run Black
        run: black --check .

      - name: Run isort
        run: isort --check-only .
